<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Kuroda's Page</title>
</head>
<body>
    <h1>ようこそ黒田のページへ！</h1>
    <div style="width: 300px; background-color: gold;">

    <div style="width: 300px; border: 3px solid skyblue;">
        <img src="https://d33whrdjw5ofau.cloudfront.net/media/instructor/_IMG_0375_.jpg" style="width: 300px;">
        <p>大湾先生です。首里校で授業をしています！めんそーれ！</p>
    </div>


    <button id="btn">押して！</button>
    <script>
        btn.onclick = function(){
            box.innerText += "BeEngineer";
        };
    </script>
